server:
  port: 8080

spring:
  application:
    name: messenger-backend
  datasource:
    url: jdbc:h2:mem:messenger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    time-zone: UTC

app:
  jwt:
    secret: "ChangeThisToALongRandomSecretKeyOfAtLeastThirtyTwoBytes!!"
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:4200

logging:
  level:
    com.messenger: INFO
    org.springframework.web.socket: INFO
