# Activate with: --spring.profiles.active=postgres
# Then set SPRING_DATASOURCE_URL / USERNAME / PASSWORD or edit below.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messenger}
    username: ${SPRING_DATASOURCE_USERNAME:messenger}
    password: ${SPRING_DATASOURCE_PASSWORD:messenger}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
